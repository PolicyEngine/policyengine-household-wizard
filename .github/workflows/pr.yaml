name: PR checks

on:
  pull_request:

jobs:
  changelog:
    name: Changelog fragment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changelog fragment
        run: .github/check_pr_fragment.sh

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Test the US sample generator
        run: uv run --no-project --python 3.12 --with 'h5py==3.16.0' python -B -m unittest discover -s tests/us-household -p 'test_generate_us_samples.py'

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Type-check a consumer of the build
        run: bun run check:consumer-types
